# Configuración de la API consulta_documentos (PÚBLICA, sin login).

api:
  # Orígenes permitidos para CORS. "*" mientras no exista el dominio de
  # CloudFront; tras el primer deploy del frontend, reemplazar por la URL de
  # CloudFront + http://localhost:5173 y redeployar.
  cors_allow_origins:
    - "*"

  # Throttling a nivel de stage (todas las rutas). Al ser pública, es la
  # protección principal contra abuso por ahora.
  throttling:
    rate_limit: 5    # requests por segundo (steady-state)
    burst_limit: 5   # pico máximo de requests concurrentes

  # Lambda (API Gateway corta a los 29 s).
  timeout_seconds: 25
  memory_mb: 256
